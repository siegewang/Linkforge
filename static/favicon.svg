<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0728"/>
      <stop offset="50%" stop-color="#070318"/>
      <stop offset="100%" stop-color="#04020f"/>
    </linearGradient>

    <!-- Cyan-Violet Glow Gradient -->
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Spark Gold Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38166b" stroke-width="1.5"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#forgeGrad)" stroke-width="1" stroke-opacity="0.4"/>

  <!-- LinkForge Interlocking Chain / Forge Emblem -->
  <g filter="url(#glow)" transform="translate(32,32)">
    <!-- Left Link Loop -->
    <path d="M-6 -10 C-14 -10 -20 -4 -20 3 C-20 10 -14 16 -6 16 C-1 16 3 13 5 9 L1 6 C-1 9 -3 11 -6 11 C-10 11 -14 7 -14 3 C-14 -1 -10 -5 -6 -5 C-3 -5 -1 -3 0 0 L5 -3 C3 -7 -1 -10 -6 -10 Z" 
          fill="url(#forgeGrad)" />
    
    <!-- Right Link Loop -->
    <path d="M6 10 C14 10 20 4 20 -3 C20 -10 14 -16 6 -16 C1 -16 -3 -13 -5 -9 L-1 -6 C1 -9 3 -11 6 -11 C10 -11 14 -7 14 -3 C14 1 10 5 6 5 C3 5 1 3 0 0 L-5 3 C-3 7 1 10 6 10 Z" 
          fill="url(#forgeGrad)" />

    <!-- Forge Central Spark / Diamond Core -->
    <polygon points="0,-6 5,0 0,6 -5,0" fill="url(#sparkGrad)" />
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
  </g>
</svg>
